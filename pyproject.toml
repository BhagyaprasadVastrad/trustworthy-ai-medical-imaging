[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-ai-medical-imaging"
version = "0.2.0"
description = "Reproducible analysis utilities for calibration, confidence and uncertainty under distribution shift"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
