name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: pytest -q
